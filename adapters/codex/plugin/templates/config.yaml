live:
  systems: []
  # e.g.
  #  - name: <what you call it>
  #    kind: portal          # portal | api | database | machine
  #    writes: true          # true if the tool creates or changes records there
  #    code: [<files or dirs that act on it>]
  #    match: [<hostname or URL prefix that marks a file as touching it>]
  #    dry_run: none         # how the tool runs without writing
  #    kill_switch: none     # how a run is stopped
  #    dom_map: none         # dated capture map selectors come from
  review_copy: none      # opt in: a folder inside your home, outside the live code, the live scope report is also copied to

# For /djinn:learn, which turns an exam question into study material and
# training data. Optional: without it, learn proposes each value from the
# repo (its CLAUDE.md, README, schema docs, folder names) and waits for you
# to say go. Every path is relative to the repo root. CONTRACTS.md section
# 13 has the rules and two filled examples. The first run writes
# <out_dir>/.gitignore holding "*", so run folders stay out of git; a run
# stops before writing anything when git tracks a file under out_dir.
learn:
  sources: []            # what the fact checker may cite, e.g. [research/, docs/research/]
  exclude: []            # never read as evidence (the input file, out_dir and audits/ always are)
  item_shape: []         # schema docs, item tests and a real bank, e.g. [content/schema/quiz.md, tests/content.test.mjs]
  banks: []              # every question bank the dedupe and leak checks read, e.g. [content/quizzes/]; a secure one makes every run secure
  writing_rules: []      # e.g. [docs/ITEM-WRITING.md]
  tiers: []              # your difficulty tiers in order, each a name and what it tests
  # e.g.
  #  - name: easy
  #    tests: the mechanism, what happens and why
  #  - name: hard
  #    tests: spot the mistake in a spec, or make the call
  scenarios: []          # settings items rotate through, each with the file its details come from
  # e.g.
  #  - name: clinic
  #    where: docs/settings/clinic.md
  secure_paths: []       # inputs from here never leave this repo; [.] for a private repo
  holdout: []            # source question ids whose rows are eval rows, never train
  out_dir: learn/        # must resolve inside the repo

# Free text every agent reads as architecture context. State model, event
